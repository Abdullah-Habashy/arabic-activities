<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>أسرتي وبيتي — حصة إيمان ٢٢ أكتوبر</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet"><style id="app-css">:root{
  --bg:#EAF0EC; --paper:#FFFFFF; --ink:#1E3A34; --soft:#5C716B; --line:#C9D6CF;
  --gold:#D99A1E; --rose:#C2546B; --rosebg:#FBE7EB; --green:#2F8A5B; --amber:#D39016; --photo:#F6F8F7;
  --shadow:0 2px 0 rgba(30,58,52,.12); color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13201D; --paper:#1C2C28; --ink:#E4EEE9; --soft:#9DB2AB; --line:#2F4741;
    --gold:#E8B04A; --rose:#E07A8F; --rosebg:#3A2228; --green:#5BBE8A; --amber:#E8A93A; --photo:#22352F;
    --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13201D; --paper:#1C2C28; --ink:#E4EEE9; --soft:#9DB2AB; --line:#2F4741;
  --gold:#E8B04A; --rose:#E07A8F; --rosebg:#3A2228; --green:#5BBE8A; --amber:#E8A93A; --photo:#22352F;
  --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Alexandria,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 90px}
.en{direction:ltr;text-align:left;unicode-bidi:isolate;color:var(--soft);font-size:.86rem;display:block}
.say{font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;font-weight:700}
header h1{font-size:clamp(1.6rem,5vw,2.3rem);margin:0;font-weight:800}
header p{margin:2px 0 0;color:var(--soft)}
nav{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
nav a{flex:1 1 140px;text-decoration:none;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;text-align:center}
nav a[aria-current="page"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
section{display:none} section.on{display:block}
.intro{background:var(--paper);border-radius:14px;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line)}
.pimg{width:100%;height:100%;object-fit:contain}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 14px;padding:8px 4px}
.pol{background:var(--paper);border:1px solid var(--line);padding:10px 10px 8px;border-radius:4px;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:transform .15s;font:inherit;color:inherit;text-align:center}
.pol:nth-child(odd){transform:rotate(-2deg)} .pol:nth-child(even){transform:rotate(1.6deg)}
.pol:hover,.pol:focus-visible{transform:rotate(0) scale(1.03)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pol .pic{background:var(--photo);aspect-ratio:1;display:grid;place-items:center;font-size:3.1rem;border-radius:2px;overflow:hidden}
.pol .cap{font-size:.78rem;margin-top:6px;min-height:1.3em}
.pol .tape{position:absolute;top:-9px;right:50%;transform:translateX(50%);width:46px;height:16px;background:var(--gold);opacity:.55;border-radius:2px}
.mark{position:absolute;top:-12px;left:-10px;width:32px;height:32px;display:block}
.mark svg,.mkic svg{width:100%;height:100%;display:block}
dialog{border:none;border-radius:18px;padding:0;max-width:520px;width:calc(100% - 28px);background:var(--paper);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(10,20,18,.55)}
.dlg{padding:20px 20px 16px;position:relative}
.dlg .big{height:120px;display:grid;place-items:center;font-size:4.2rem;line-height:1.2}
.dlg .big img{max-height:120px;max-width:70%;object-fit:contain}
.dlg .q{font-size:1.9rem;text-align:center;margin:6px 0 2px}
.dlg .en{text-align:center}
.reveal{min-height:3.4rem;margin:12px 0;padding:10px;border-radius:12px;background:var(--photo);text-align:center;font-size:1.6rem;display:flex;align-items:center;justify-content:center}
.reveal.hint{color:var(--amber)} .reveal.ans{color:var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;font-weight:600}
button.mk{flex:1 1 120px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px}
.mkic{width:40px;height:40px;display:block}
.mk small{font-weight:400;font-size:.75rem;direction:ltr;color:var(--soft)}
.mk-h:hover{border-color:var(--green)} .mk-t:hover{border-color:var(--amber)} .mk-x:hover{border-color:var(--rose)}
.close{position:absolute;top:10px;left:12px;border:none;font-size:1.3rem;padding:2px 8px}
.stage{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:end}
@media (max-width:620px){.stage{grid-template-columns:1fr}}
.house{position:relative;padding-top:56px}
.roof{position:absolute;top:0;left:0;right:0;height:60px;color:var(--ink)}
.rooms{display:grid;grid-template-columns:1fr 1fr;border:4px solid var(--ink);background:var(--paper)}
.room,.mosque{position:relative;min-height:140px;padding:8px;border:2px dashed var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;color:inherit;font:inherit;border-radius:0}
.room.wide{grid-column:1 / -1}
.ico{min-width:64px;height:64px;display:grid;place-items:center;font-size:2.4rem;overflow:hidden}
.mosque{border:4px solid var(--ink);background:var(--paper);min-height:180px;border-radius:60px 60px 0 0}
.who{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:2.4rem}
.who .ico{min-width:40px;height:40px;font-size:1.7rem}
.ico .pimg{width:64px;height:64px;object-fit:contain}
.who .ico .pimg{width:40px;height:40px}
.chip .ico .pimg,.tok .ico .pimg{width:56px;height:56px}
.pol .pic .pimg{object-fit:cover}
.ico .pimg{object-fit:cover;border-radius:8px}
.room>.ico,.mosque>.ico{min-width:96px;height:96px}
.room>.ico .pimg,.mosque>.ico .pimg{width:96px;height:96px}
.target{outline:3px solid var(--gold);outline-offset:-6px}
.tray{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;justify-content:center}
.tok{padding:4px 8px;border-radius:14px}
.tok[aria-pressed="true"]{border-color:var(--gold);background:var(--photo);transform:translateY(-3px)}
.tok.placed{opacity:.35}
.steps{display:grid;gap:10px;margin-top:16px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.step h3{margin:0 0 4px;font-size:1.05rem}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.chip{position:relative;padding:4px 8px}
.chip .mark{width:24px;height:24px;top:-10px;left:-10px}
.chip:disabled{opacity:.35;cursor:not-allowed}
table{width:100%;border-collapse:collapse;background:var(--paper)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{background:var(--ink);color:var(--bg)}
td .mkic{width:28px;height:28px}
.sum{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.sum div{flex:1 1 120px;background:var(--paper);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.sum b{font-size:1.8rem}
.sum button{flex:1 1 120px;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.sum button[aria-pressed="true"]{border-color:var(--green);background:var(--photo)}
.fnote{color:var(--soft);font-size:.85rem;margin:-4px 0 10px}
.tw{overflow-x:auto;border-radius:12px}
/* teacher edit */
.tbar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:none;gap:8px;background:var(--ink);padding:8px;border-radius:14px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tbar.show{display:flex}
.tbar button{border-color:transparent}
.tbar .pub{background:var(--gold);color:#1E3A34}
.tbar .msg{color:var(--bg);align-self:center;font-size:.85rem;padding:0 6px}
body.editing .pol,body.editing .chip,body.editing .tok,body.editing .room,body.editing .mosque{outline:2px dashed var(--gold);outline-offset:3px}
.pen{position:absolute;bottom:-10px;right:-8px;background:var(--gold);color:#1E3A34;border-radius:50%;width:26px;height:26px;display:none;place-items:center;font-size:.8rem}
body.editing .pen{display:grid}
.ed label{display:block;font-weight:600;margin:10px 0 3px;font-size:.9rem}
.ed input[type=text]{width:100%;font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--photo);color:var(--ink)}
.ed .ltr{direction:ltr;text-align:left}
.ed .prev{height:110px;display:grid;place-items:center;font-size:3.6rem;background:var(--photo);border-radius:12px;overflow:hidden}
.ed .prev img{max-height:110px;max-width:100%;object-fit:contain}
.ed .note{font-size:.8rem;color:var(--soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const mark=id=>st.marks[id]?`<span class="mark">${ICO[st.marks[id]]}</span>`:"";
const pen='<span class="pen">✏️</span>';
let editing=false, dirty=false;

function items(){
  const L=[];
  DATA.family.forEach(f=>L.push({id:f.id,label:"صورة أسرتي",text:f.id==="a10"?"تعريف حر بعيلتها":f.ans}));
  DATA.places.forEach(p=>L.push({id:"w-"+p.id,label:"ما هذا؟",text:p.what}));
  DATA.people.forEach(p=>{const pl=byId(DATA.places,st.place[p.id]); L.push({id:"r-"+p.id,label:"أين؟",text:pl?p.name+" "+pl.inP+".":p.q});});
  L.push({id:"ask",label:"اسألي أنتِ",text:"أَيْنَ ... يا أُسْتاذُ؟"});
  return L;
}

/* quiz dialog */
let cur=null; const dlg=$("#dlg"), edlg=$("#edlg");
function openQ(it){cur=it;$("#d-big").innerHTML=it.big;$("#d-q").textContent=it.q;$("#d-en").textContent=it.en||"";
  const r=$("#d-rev");r.textContent="";r.className="reveal say";dlg.showModal();}
$("#b-hint").onclick=()=>{const r=$("#d-rev");r.textContent=cur.hint;r.className="reveal say hint";};
$("#b-ans").onclick=()=>{const r=$("#d-rev");r.textContent=cur.ans;r.className="reveal say ans";};
$$("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());
[dlg,edlg].forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close()}));
$$(".mk").forEach(b=>b.onclick=()=>{st.marks[cur.id]=b.dataset.m;save();dlg.close();renderAll();});

/* editor */
const FIELDS={
 family:[["en","التلميح المعنوي (إنجليزي، يظهر للطالبة)",1],["q","السؤال"],["hint","التلميح"],["ans","الإجابة النموذجية"]],
 places:[["en","معنى المكان (إنجليزي)",1],["what","إجابة: ما هذا؟"],["inP","في + المكان (للإجابة عن أين)"]],
 people:[["en","معنى الشخص (إنجليزي)",1],["name","الاسم في الجملة"],["q","السؤال: أين ...؟"]]
};
let eTarget=null, eImg="";
function openEdit(kind,id){
  const o=byId(DATA[kind],id); eTarget={kind,o}; eImg=o.img;
  $("#e-img").value=/^data:/.test(o.img)?"":o.img; $("#e-file").value="";
  $("#e-prev").innerHTML=pic(eImg);
  $("#e-fields").innerHTML=FIELDS[kind].map(([k,l,ltr])=>`<label>${l}</label><input type="text" data-f="${k}" class="${ltr?"ltr":""}" value="${esc(o[k])}">`).join("");
  edlg.showModal();
}
$("#e-img").oninput=e=>{eImg=e.target.value;$("#e-prev").innerHTML=pic(eImg);};
const DEF={family:{a1:"🖼️",a2:"👴",a3:"👵",a4:"👨",a5:"👩‍⚕️",a6:"👩‍🏫",a7:"👧",a8:"👧🏻",a9:"🙋‍♀️",a10:"📷"},places:{ghurfa:"🛏️",hammam:"🛁",musalla:"🧎",masjid:"🕌"},people:{jadd:"👴",jadda:"👵",walid:"👨",awlad:"👦👧"}};
$("#e-reset").onclick=()=>{const d=eTarget.o.orig||(DEF[eTarget.kind]||{})[eTarget.o.id]; if(!d) return; eImg=d; $("#e-img").value=/^data:/.test(d)?"":d; $("#e-file").value=""; $("#e-prev").innerHTML=pic(eImg);};
$("#e-file").onchange=e=>{const f=e.target.files[0]; if(!f) return;
  const img=new Image(), u=URL.createObjectURL(f);
  img.onload=()=>{const m=400,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let d=c.toDataURL("image/webp",0.85); if(!/^data:image\/webp/.test(d)) d=c.toDataURL("image/png");
    eImg=d;$("#e-prev").innerHTML=pic(eImg);URL.revokeObjectURL(u);};
  img.src=u;};
$("#e-ok").onclick=()=>{const o=eTarget.o; o.img=eImg||o.img;
  $$("#e-fields [data-f]").forEach(i=>o[i.dataset.f]=i.value);
  dirty=true; $("#t-pub").hidden=false; $("#t-msg").textContent="فيه تعديلات لسه ما اتنشرتش"; edlg.close(); renderAll();};

/* renders */
function renderAlbum(){
  $("#album").innerHTML=DATA.family.map(f=>`<button class="pol" data-id="${f.id}"><span class="tape"></span>${mark(f.id)}${pen}<div class="pic">${pic(f.img)}</div><div class="cap en" style="text-align:center">${esc(f.en)}</div></button>`).join("");
  $$(".pol").forEach(b=>b.onclick=()=>{const f=byId(DATA.family,b.dataset.id);
    if(editing) return openEdit("family",f.id);
    openQ({id:f.id,big:pic(f.img),q:f.q,en:f.en,hint:f.hint,ans:f.ans});});
}
let sel=null;
function placeBtn(p,cls){return `<button class="${cls}" data-p="${p.id}">${pen}<span class="ico">${pic(p.img)}</span><span class="who"></span></button>`;}
function renderHouse(){
  $("#tray").innerHTML=DATA.people.map(p=>`<button class="tok${st.place[p.id]?" placed":""}" data-k="${p.id}" aria-pressed="${sel===p.id}" style="position:relative">${pen}<span class="ico">${pic(p.img)}</span></button>`).join("");
  $$(".tok").forEach(b=>b.onclick=()=>{if(editing) return openEdit("people",b.dataset.k); sel=sel===b.dataset.k?null:b.dataset.k; renderHouse();});
  const [g,h,m,ms]=["ghurfa","hammam","musalla","masjid"].map(i=>byId(DATA.places,i));
  $("#rooms").innerHTML=placeBtn(g,"room")+placeBtn(h,"room")+placeBtn(m,"room wide");
  $("#outside").innerHTML=placeBtn(ms,"mosque").replace('class="mosque"','class="mosque" style="width:100%"');
  $$("[data-p]").forEach(el=>{const p=el.dataset.p;
    el.querySelector(".who").innerHTML=Object.entries(st.place).filter(([,v])=>v===p).map(([k])=>`<span class="ico">${pic(byId(DATA.people,k).img)}</span>`).join("");
    el.classList.toggle("target",!!sel&&!editing);
    el.onclick=()=>{if(editing) return openEdit("places",p); if(!sel) return; st.place[sel]=p; delete st.marks["r-"+sel]; sel=null; save(); renderAll();};});
  $("#c-what").innerHTML=DATA.places.map(p=>`<button class="chip" data-k="${p.id}">${mark("w-"+p.id)}${pen}<span class="ico">${pic(p.img)}</span></button>`).join("");
  $$("#c-what .chip").forEach(b=>b.onclick=()=>{const p=byId(DATA.places,b.dataset.k); if(editing) return openEdit("places",p.id);
    openQ({id:"w-"+p.id,big:pic(p.img),q:"ما هذا؟",en:p.en,hint:p.what.split(" ")[0]+" ...",ans:p.what});});
  $("#c-where").innerHTML=DATA.people.map(p=>`<button class="chip" data-k="${p.id}" ${st.place[p.id]||editing?"":"disabled"}>${mark("r-"+p.id)}${pen}<span class="ico">${pic(p.img)}</span></button>`).join("");
  $$("#c-where .chip").forEach(b=>b.onclick=()=>{const p=byId(DATA.people,b.dataset.k); if(editing) return openEdit("people",p.id);
    const pl=byId(DATA.places,st.place[p.id]);
    openQ({id:"r-"+p.id,big:pic(p.img)+'<span style="font-size:2rem;margin:0 8px">←</span>'+pic(pl.img),q:p.q,en:"",hint:p.name+" في ...",ans:p.name+" "+pl.inP+"."});});
  $("#c-ask").innerHTML=`<button class="chip" id="askb">${mark("ask")}<span class="ico">🗣️</span></button>`;
  $("#askb").onclick=()=>{if(editing) return; const p=DATA.people[Math.floor(Math.random()*DATA.people.length)];
    openQ({id:"ask",big:pic(p.img),q:"اسألي الأستاذ",en:"Ask where the "+p.en+" is. Use يا + your teacher.",hint:"أَيْنَ ... يا ...؟",ans:p.q.replace("؟"," يا أُسْتاذُ؟")});};
}
let filt=new Set();
const FL={h:"لوحدها",t:"بتلميح",x:"لسه",n:"ما اتعملتش"};
const keyOf=i=>st.marks[i.id]||"n";
const shown=()=>items().filter(i=>!filt.size||filt.has(keyOf(i)));
const fLabel=()=>[...filt].map(k=>FL[k]).join(" + ");
function renderResult(){
  const c={h:0,t:0,x:0,n:0}; items().forEach(i=>c[keyOf(i)]++);
  $("#rows").innerHTML=shown().map(i=>{const m=st.marks[i.id];
    return `<tr><td>${i.label}</td><td class="say" style="font-size:1.1rem">${esc(i.text)}</td><td>${m?`<span class="mkic" style="width:28px;height:28px">${ICO[m]}</span>`:"—"}</td></tr>`;}).join("")||'<tr><td colspan="3" style="text-align:center;color:var(--soft)">مفيش بنود هنا</td></tr>';
  const ic={h:ICO.h,t:ICO.t,x:ICO.x,n:'<span style="display:grid;place-items:center;height:100%;font-size:1.6rem">○</span>'};
  $("#sum").innerHTML=["h","t","x","n"].map(k=>`<button data-f="${k}" aria-pressed="${filt.has(k)}"><span class="mkic">${ic[k]}</span><b>${c[k]}</b>${FL[k]}</button>`).join("");
  $$("#sum button").forEach(b=>b.onclick=()=>{const k=b.dataset.f; filt.has(k)?filt.delete(k):filt.add(k); renderResult();});
  $("#fnote").textContent=filt.size?`معروض: ${fLabel()} بس. اضغط على أي خانة متحددة علشان تلغي تحديدها.`:"اضغط على خانة أو أكتر علشان تعرض بنودها بس.";
}
function loadJS(src){return new Promise((ok,no)=>{const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e);});}
async function makePDF(){
  const btn=$("#pdf"); btn.disabled=true; const t0=btn.textContent; btn.textContent="جارِ التجهيز...";
  try{
    if(!window.html2canvas) await loadJS("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    if(!window.jspdf) await loadJS("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const L=shown(), box=document.createElement("div");
    box.style.cssText="position:fixed;left:-10000px;top:0;width:760px;padding:28px;background:#fff;color:#1E3A34;direction:rtl;font-family:Alexandria,Tahoma,sans-serif";
    const col={h:"#2F8A5B",t:"#2F8A5B",x:"#C2546B",n:"#5C716B"};
    const svgFix=k=>(ICO[k]||"").replace(/var\(--green\)/g,"#2F8A5B").replace(/var\(--paper\)/g,"#fff").replace(/var\(--rose\)/g,"#C2546B").replace(/var\(--rosebg\)/g,"#FBE7EB");
    box.innerHTML=`<div style="font-size:24px;font-weight:800">نتيجة حصة الخميس ٢٢ أكتوبر</div>
      <div style="color:#5C716B;margin:4px 0 16px">الطالبة: إيمان، الوحدة الثانية: الأسرة، ${filt.size?"البنود: "+fLabel():"كل البنود"} (${L.length})</div>
      <table style="width:100%;border-collapse:collapse;font-size:15px">
      <tr style="background:#1E3A34;color:#fff"><th style="padding:8px;text-align:right">#</th><th style="padding:8px;text-align:right">البند</th><th style="padding:8px;text-align:right">الجملة</th><th style="padding:8px;text-align:right">التقييم</th></tr>
      ${L.map((i,n)=>{const k=keyOf(i);return `<tr style="border-bottom:1px solid #C9D6CF"><td style="padding:8px">${(n+1).toLocaleString("ar-EG")}</td><td style="padding:8px">${i.label}</td><td style="padding:8px;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:18px">${esc(i.text)}</td><td style="padding:8px;color:${col[k]}"><span style="display:inline-block;width:22px;height:22px;vertical-align:middle">${svgFix(k)}</span> ${FL[k]}</td></tr>`;}).join("")}</table>`;
    document.body.appendChild(box);
    const cv=await html2canvas(box,{scale:2,backgroundColor:"#ffffff"}); box.remove();
    const {jsPDF}=window.jspdf, pdf=new jsPDF({unit:"pt",format:"a4"});
    const W=pdf.internal.pageSize.getWidth(), H=pdf.internal.pageSize.getHeight(), m=24;
    const pw=W-2*m, ph=H-2*m, sliceH=Math.floor(cv.width*ph/pw);
    for(let y=0,pg=0;y<cv.height;y+=sliceH,pg++){
      const c=document.createElement("canvas"); c.width=cv.width; c.height=Math.min(sliceH,cv.height-y);
      c.getContext("2d").drawImage(cv,0,y,cv.width,c.height,0,0,cv.width,c.height);
      if(pg) pdf.addPage(); pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",m,m,pw,c.height*pw/cv.width);
    }
    const buf=pdf.output("arraybuffer"), name="نتيجة-إيمان-22-10"+(filt.size?"-"+[...filt].map(k=>FL[k]).join("-"):"")+".pdf";
    let dl=null; try{if(window.claude&&window.claude.use) dl=await window.claude.use("downloads");}catch(e){}
    if(dl){ try{await dl.save({filename:name,data:buf});}catch(e){ if(e&&e.code!=="declined") btn.textContent="ما اتحملش، جرّب تاني"; } }
    else{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([buf],{type:"application/pdf"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  }catch(e){ btn.textContent="ما اتحملش، جرّب تاني"; setTimeout(()=>{btn.textContent=t0;},2500); btn.disabled=false; return; }
  btn.textContent=t0; btn.disabled=false;
}
$("#pdf").onclick=makePDF;
$("#copy").onclick=async()=>{const t=shown().map(i=>`${i.label} | ${i.text} | ${st.marks[i.id]?MKTXT[st.marks[i.id]]:"-"}`).join("\n");
  try{await navigator.clipboard.writeText("إيمان — حصة ٢٢/١٠\n"+t);$("#copy").textContent="اتنسخت ✓";}catch(e){$("#copy").textContent="صوّري الشاشة بدل النسخ";}};
$("#reset").onclick=()=>{if(confirm("تمسحي كل الإجابات وتبدئي من جديد؟")){st={marks:{},place:{}};save();renderAll();}};
function renderAll(){document.body.classList.toggle("editing",editing);renderAlbum();renderHouse();renderResult();}
function route(){const t=["family","house","result"].includes(location.hash.slice(1))?location.hash.slice(1):"family";
  $$("section").forEach(s=>s.classList.toggle("on",s.id==="s-"+t));
  $$("nav a").forEach(a=>{if(a.dataset.t===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  if(t==="result")renderResult();}
$$("nav a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();history.replaceState(null,"","#"+a.dataset.t);route();window.scrollTo(0,0);}));
window.addEventListener("hashchange",route);
renderAll();route();

/* teacher tools */
function buildDoc(){
  const css=document.getElementById("app-css").textContent, js=document.getElementById("app-js").textContent;
  const data=JSON.stringify(DATA).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(document.title)+'</title>'+FONTS+'<style id="app-css">'+css+'</style></head><body><div id="app"></div><script id="app-data" type="application/json">'+data+'<\/script><script id="app-js">'+js+'<\/script></body></html>';
}
let art=null;
function enableTeacher(){$("#tbar").classList.add("show");}
$("#t-edit").onclick=()=>{editing=!editing;$("#t-edit").textContent=editing?"✓ إنهاء التعديل":"✏️ تعديل الصور والجمل";
  $("#t-msg").textContent=editing?"اضغط على أي صورة أو مكان أو شخص لتعديله":(dirty?"فيه تعديلات لسه ما اتنشرتش":"");renderAll();};
$("#t-pub").onclick=async()=>{
  if(standalone){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buildDoc()],{type:"text/html"}));a.download="أسرتي-وبيتي.html";document.body.appendChild(a);a.click();a.remove();dirty=false;$("#t-pub").hidden=true;$("#t-msg").textContent="اتحمّلت نسخة جديدة ✓ استخدمها بدل الملف القديم";}catch(e){$("#t-msg").textContent="ما اتحمّلتش، جرّب تاني";}return;}
  if(!art){$("#t-msg").textContent="النشر متاح لما تفتح الصفحة من حسابك على Claude";return;}
  $("#t-pub").disabled=true;$("#t-msg").textContent="جارِ النشر...";
  try{await art.publish(buildDoc());dirty=false;$("#t-msg").textContent="اتنشرت ✓";}
  catch(e){const c=e&&e.code;$("#t-msg").textContent=c==="conflict"?"فيه نسخة أحدث، الصفحة بتتحدث":(c==="not_writer"||c==="not_granted")?"الصفحة دي للعرض بس من الحساب ده":"ما اتنشرتش، جرّب تاني";
    if(c==="upstream_error") setTimeout(()=>{$("#t-pub").disabled=false;},1500+Math.random()*1000); else $("#t-pub").disabled=false;}
};
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});
window.__teacher=enableTeacher;
let standalone=false;
(async()=>{try{if(!window.claude||!window.claude.use){standalone=true;enableTeacher();$("#t-pub").textContent="حفظ نسخة جديدة";return;}
  const [user,a]=await Promise.all([window.claude.use("user"),window.claude.use("artifact")]);
  art=a; const ok=user?await user.canEdit():false; if(ok&&art) enableTeacher();}catch(e){}})();
})();
</script></body></html>
