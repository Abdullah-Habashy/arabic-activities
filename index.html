<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الأنشطة التفاعلية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }

    /* خلفية نجوم */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 60px 60px, 30px 30px;
      background-position: 0 0, 15px 15px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      width: 100%;
      max-width: 700px;
    }

    .title {
      color: #ffffff;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 900;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 40px rgba(100, 200, 255, 0.5);
      letter-spacing: 1px;
    }

    .subtitle {
      color: rgba(255,255,255,0.6);
      font-size: clamp(1rem, 3vw, 1.3rem);
      margin-bottom: 3.5rem;
      font-weight: 400;
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 500px) {
      .buttons-grid {
        grid-template-columns: 1fr;
      }
    }

    .section-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2.5rem 0 2rem;
    }

    .section-divider::before,
    .section-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.15);
    }

    .section-divider span {
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      white-space: nowrap;
      padding: 0.3rem 0.8rem;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
    }

    .section-title {
      color: rgba(255,255,255,0.85);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: 0.5px;
    }

    .btn-teacher {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 8px 32px rgba(245, 158, 11, 0.4);
    }

    .btn-teacher:hover {
      box-shadow: 0 16px 48px rgba(245, 158, 11, 0.6);
    }

    .btn-student {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 8px 32px rgba(239, 68, 68, 0.4);
    }

    .btn-student:hover {
      box-shadow: 0 16px 48px rgba(239, 68, 68, 0.6);
    }

    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding: 2.5rem 1.5rem;
      border-radius: 24px;
      text-decoration: none;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      font-size: clamp(1.2rem, 3.5vw, 1.6rem);
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.25s ease;
      border-radius: inherit;
    }

    .btn:hover::after {
      background: rgba(255,255,255,0.08);
    }

    .btn:hover {
      transform: translateY(-6px) scale(1.03);
      filter: brightness(1.1);
    }

    .btn:active {
      transform: translateY(-2px) scale(0.98);
    }

    .btn-family {
      background: linear-gradient(135deg, #e040fb, #7c4dff);
      box-shadow: 0 8px 32px rgba(124, 77, 255, 0.45);
    }

    .btn-family:hover {
      box-shadow: 0 16px 48px rgba(124, 77, 255, 0.65);
    }

    .btn-fix {
      background: linear-gradient(135deg, #00bcd4, #0097a7);
      box-shadow: 0 8px 32px rgba(0, 188, 212, 0.45);
    }

    .btn-fix:hover {
      box-shadow: 0 16px 48px rgba(0, 188, 212, 0.65);
    }

    .btn-reels {
      background: linear-gradient(135deg, #f97316, #dc2626);
      box-shadow: 0 8px 32px rgba(249, 115, 22, 0.45);
    }

    .btn-reels:hover {
      box-shadow: 0 16px 48px rgba(249, 115, 22, 0.65);
    }

    .btn-icon {
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1;
    }

    .btn-label {
      line-height: 1.3;
    }

    .footer {
      margin-top: 3rem;
      color: rgba(255,255,255,0.3);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">✨ الأنشطة التفاعلية</h1>
    <p class="subtitle">اختر النشاط الذي تريده</p>

    <div class="buttons-grid">
      <a href="family.html" class="btn btn-family" id="btn-family">
        <span class="btn-icon">🏠</span>
        <span class="btn-label">أسرتي وبيتي</span>
      </a>
      <a href="fix.html" class="btn btn-fix" id="btn-fix">
        <span class="btn-icon">🔧</span>
        <span class="btn-label">نثبّت معًا</span>
      </a>
    </div>

    <div class="section-divider">
      <span>📝 الاختبار القبلي التشخيصي</span>
    </div>

    <p class="section-title">الوحدة الثانية: الأسرة</p>

    <div class="buttons-grid">
      <a href="quiz-teacher.html" class="btn btn-teacher" id="btn-teacher">
        <span class="btn-icon">👩‍🏫</span>
        <span class="btn-label">لوحة المعلم</span>
      </a>
      <a href="quiz-student.html" class="btn btn-student" id="btn-student">
        <span class="btn-icon">🎓</span>
        <span class="btn-label">صفحة الطالب</span>
      </a>
    </div>

    <div class="section-divider">
      <span>🎬 ربع بكالوريا</span>
    </div>

    <div class="buttons-grid">
      <a href="reels.html" class="btn btn-reels" id="btn-reels" style="grid-column: 1 / -1;">
        <span class="btn-icon">🎬</span>
        <span class="btn-label">ريلز ربع بكالوريا</span>
      </a>
    </div>

    <p class="footer">اضغط على أي زر للبدء</p>
  </div>
</body>
</html>
