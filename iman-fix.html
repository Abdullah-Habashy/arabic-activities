<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>نثبّت معًا — أنشطة تثبيت إيمان</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet"><style>:root{
  --bg:#EAF0EC; --paper:#FFFFFF; --ink:#1E3A34; --soft:#5C716B; --line:#C9D6CF;
  --gold:#D99A1E; --rose:#C2546B; --rosebg:#FBE7EB; --green:#2F8A5B; --amber:#D39016; --photo:#F6F8F7;
  --shadow:0 2px 0 rgba(30,58,52,.12); color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13201D; --paper:#1C2C28; --ink:#E4EEE9; --soft:#9DB2AB; --line:#2F4741;
    --gold:#E8B04A; --rose:#E07A8F; --rosebg:#3A2228; --green:#5BBE8A; --amber:#E8A93A; --photo:#22352F;
    --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13201D; --paper:#1C2C28; --ink:#E4EEE9; --soft:#9DB2AB; --line:#2F4741;
  --gold:#E8B04A; --rose:#E07A8F; --rosebg:#3A2228; --green:#5BBE8A; --amber:#E8A93A; --photo:#22352F;
  --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Alexandria,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 90px}
.en{direction:ltr;text-align:left;unicode-bidi:isolate;color:var(--soft);font-size:.86rem;display:block}
.say{font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;font-weight:700}
header h1{font-size:clamp(1.6rem,5vw,2.3rem);margin:0;font-weight:800}
header p{margin:2px 0 0;color:var(--soft)}
nav{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
nav a{flex:1 1 140px;text-decoration:none;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;text-align:center}
nav a[aria-current="page"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
section{display:none} section.on{display:block}
.intro{background:var(--paper);border-radius:14px;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line)}
.pimg{width:100%;height:100%;object-fit:contain}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 14px;padding:8px 4px}
.pol{background:var(--paper);border:1px solid var(--line);padding:10px 10px 8px;border-radius:4px;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:transform .15s;font:inherit;color:inherit;text-align:center}
.pol:nth-child(odd){transform:rotate(-2deg)} .pol:nth-child(even){transform:rotate(1.6deg)}
.pol:hover,.pol:focus-visible{transform:rotate(0) scale(1.03)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pol .pic{background:var(--photo);aspect-ratio:1;display:grid;place-items:center;font-size:3.1rem;border-radius:2px;overflow:hidden}
.pol .cap{font-size:.78rem;margin-top:6px;min-height:1.3em}
.pol .tape{position:absolute;top:-9px;right:50%;transform:translateX(50%);width:46px;height:16px;background:var(--gold);opacity:.55;border-radius:2px}
.mark{position:absolute;top:-12px;left:-10px;width:32px;height:32px;display:block}
.mark svg,.mkic svg{width:100%;height:100%;display:block}
dialog{border:none;border-radius:18px;padding:0;max-width:520px;width:calc(100% - 28px);background:var(--paper);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(10,20,18,.55)}
.dlg{padding:20px 20px 16px;position:relative}
.dlg .big{height:120px;display:grid;place-items:center;font-size:4.2rem;line-height:1.2}
.dlg .big img{max-height:120px;max-width:70%;object-fit:contain}
.dlg .q{font-size:1.9rem;text-align:center;margin:6px 0 2px}
.dlg .en{text-align:center}
.reveal{min-height:3.4rem;margin:12px 0;padding:10px;border-radius:12px;background:var(--photo);text-align:center;font-size:1.6rem;display:flex;align-items:center;justify-content:center}
.reveal.hint{color:var(--amber)} .reveal.ans{color:var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;font-weight:600}
button.mk{flex:1 1 120px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px}
.mkic{width:40px;height:40px;display:block}
.mk small{font-weight:400;font-size:.75rem;direction:ltr;color:var(--soft)}
.mk-h:hover{border-color:var(--green)} .mk-t:hover{border-color:var(--amber)} .mk-x:hover{border-color:var(--rose)}
.close{position:absolute;top:10px;left:12px;border:none;font-size:1.3rem;padding:2px 8px}
.stage{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:end}
@media (max-width:620px){.stage{grid-template-columns:1fr}}
.house{position:relative;padding-top:56px}
.roof{position:absolute;top:0;left:0;right:0;height:60px;color:var(--ink)}
.rooms{display:grid;grid-template-columns:1fr 1fr;border:4px solid var(--ink);background:var(--paper)}
.room,.mosque{position:relative;min-height:140px;padding:8px;border:2px dashed var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;color:inherit;font:inherit;border-radius:0}
.room.wide{grid-column:1 / -1}
.ico{min-width:64px;height:64px;display:grid;place-items:center;font-size:2.4rem;overflow:hidden}
.mosque{border:4px solid var(--ink);background:var(--paper);min-height:180px;border-radius:60px 60px 0 0}
.who{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:2.4rem}
.who .ico{min-width:40px;height:40px;font-size:1.7rem}
.ico .pimg{width:64px;height:64px;object-fit:contain}
.who .ico .pimg{width:40px;height:40px}
.chip .ico .pimg,.tok .ico .pimg{width:56px;height:56px}
.pol .pic .pimg{object-fit:cover}
.ico .pimg{object-fit:cover;border-radius:8px}
.room>.ico,.mosque>.ico{min-width:96px;height:96px}
.room>.ico .pimg,.mosque>.ico .pimg{width:96px;height:96px}
.target{outline:3px solid var(--gold);outline-offset:-6px}
.tray{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;justify-content:center}
.tok{padding:4px 8px;border-radius:14px}
.tok[aria-pressed="true"]{border-color:var(--gold);background:var(--photo);transform:translateY(-3px)}
.tok.placed{opacity:.35}
.steps{display:grid;gap:10px;margin-top:16px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.step h3{margin:0 0 4px;font-size:1.05rem}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.chip{position:relative;padding:4px 8px}
.chip .mark{width:24px;height:24px;top:-10px;left:-10px}
.chip:disabled{opacity:.35;cursor:not-allowed}
table{width:100%;border-collapse:collapse;background:var(--paper)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{background:var(--ink);color:var(--bg)}
td .mkic{width:28px;height:28px}
.sum{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.sum div{flex:1 1 120px;background:var(--paper);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.sum b{font-size:1.8rem}
.sum button{flex:1 1 120px;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.sum button[aria-pressed="true"]{border-color:var(--green);background:var(--photo)}
.fnote{color:var(--soft);font-size:.85rem;margin:-4px 0 10px}
.tw{overflow-x:auto;border-radius:12px}
/* teacher edit */
.tbar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:none;gap:8px;background:var(--ink);padding:8px;border-radius:14px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tbar.show{display:flex}
.tbar button{border-color:transparent}
.tbar .pub{background:var(--gold);color:#1E3A34}
.tbar .msg{color:var(--bg);align-self:center;font-size:.85rem;padding:0 6px}
body.editing .pol,body.editing .chip,body.editing .tok,body.editing .room,body.editing .mosque{outline:2px dashed var(--gold);outline-offset:3px}
.pen{position:absolute;bottom:-10px;right:-8px;background:var(--gold);color:#1E3A34;border-radius:50%;width:26px;height:26px;display:none;place-items:center;font-size:.8rem}
body.editing .pen{display:grid}
.ed label{display:block;font-weight:600;margin:10px 0 3px;font-size:.9rem}
.ed input[type=text]{width:100%;font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--photo);color:var(--ink)}
.ed .ltr{direction:ltr;text-align:left}
.ed .prev{height:110px;display:grid;place-items:center;font-size:3.6rem;background:var(--photo);border-radius:12px;overflow:hidden}
.ed .prev img{max-height:110px;max-width:100%;object-fit:contain}
.ed .note{font-size:.8rem;color:var(--soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- session (site) ---- */
.sess{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sess .lnk{direction:ltr;unicode-bidi:isolate;font-size:.85rem;background:var(--photo);padding:6px 10px;border-radius:8px;flex:1 1 240px;overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--line);margin-inline-end:6px}
.dot.on{background:var(--green)}
.live{margin:10px 0;padding:10px;border-radius:12px;border:2px dashed var(--line);text-align:center}
.live b{display:block;margin-bottom:4px}
.live .mkic{display:inline-block;vertical-align:middle;width:30px;height:30px}
button.mk[aria-pressed="true"]{border-color:var(--green);background:var(--photo)}
.login{max-width:360px;margin:60px auto;background:var(--paper);padding:20px;border-radius:16px;display:grid;gap:10px}
.login input{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--photo);color:var(--ink)}
.stu{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.stu .card{background:var(--paper);border-radius:18px;padding:20px;border:1px solid var(--line)}
.wait{text-align:center;padding:60px 10px;color:var(--soft)}
.wait .big{font-size:3rem}
.sent{color:var(--green);text-align:center;margin-top:8px;min-height:1.4em}
.tw2{font-size:.85rem;color:var(--soft)}
.dlg .big{display:flex;align-items:center;justify-content:center;gap:6px}
.dlg .big img{max-height:120px;max-width:44%;object-fit:contain;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:8px 0 18px}
.tile{position:relative;padding-bottom:22px!important;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.tile .pimg{width:100%;height:86px;object-fit:cover;border-radius:8px}
.tile .t{word-spacing:.25em;font-family:"Noto Naskh Arabic",serif;font-weight:700;font-size:1.15rem;line-height:1.5}
.tile .code{position:absolute;bottom:6px;left:8px;font-size:.7rem;color:var(--soft)}
.tile .mark{top:-10px;left:-10px;width:28px;height:28px}
h2.sec{font-size:1.15rem;margin:16px 0 4px}
.dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:220px}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--green);display:block}
.tile .dots{max-width:120px;gap:5px}.tile .dots i{width:14px;height:14px}
.dlg .show{font-family:"Noto Naskh Arabic",serif;font-weight:700;font-size:2rem;text-align:center;line-height:1.6;margin:4px 0}
.verdict{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 0}
.verdict button.on{border-color:var(--ink);background:var(--photo)}
.vres{text-align:center;font-weight:700;min-height:1.5em;margin-top:6px}
.vres.ok{color:var(--green)}.vres.no{color:var(--rose)}
.sum button{flex:1 1 120px;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;background:var(--paper)}
.sum button[aria-pressed="true"]{border-color:var(--green);background:var(--photo)}
.fnote{color:var(--soft);font-size:.85rem;margin:-4px 0 10px}

const fLabel=()=>[...filt].map(k=>FL[k]).join(" + ");
function renderResult(){const c={h:0,t:0,x:0,n:0}; CARDS.forEach(x=>c[keyOf(x)]++);
  $("#rows").innerHTML=shown().map(x=>{const m=st.marks[x.id];return `<tr><td>${SECS[x.sec].n}. ${SECS[x.sec].name}</td><td class="say" style="font-size:1.05rem">${esc(label(x))}${x.kind==="dots"?" ("+x.n+")":""}</td><td>${esc(x.item)}</td><td>${m?`<span class="mkic" style="width:26px;height:26px">${ICO[m]}</span>`:"—"}</td></tr>`;}).join("")||'<tr><td colspan="4" style="text-align:center;color:var(--soft)">مفيش بطاقات هنا</td></tr>';
  const icn={h:ICO.h,t:ICO.t,x:ICO.x,n:'<span style="display:grid;place-items:center;height:100%;font-size:1.6rem">○</span>'};
  $("#sum").innerHTML=["h","t","x","n"].map(k=>`<button data-f="${k}" aria-pressed="${filt.has(k)}"><span class="mkic">${icn[k]}</span><b>${c[k]}</b>${FL[k]}</button>`).join("");
  $$("#sum button").forEach(b=>b.onclick=()=>{const k=b.dataset.f; filt.has(k)?filt.delete(k):filt.add(k); renderResult();});
  $("#fnote").textContent=filt.size?`معروض: ${fLabel()} بس. اضغط على أي خانة متحددة علشان تلغي تحديدها.`:"اضغط على خانة أو أكتر علشان تعرض بطاقاتها بس.";}
$("#copy").onclick=async()=>{const t=shown().map(x=>`${SECS[x.sec].name} | ${label(x)} | ${x.item} | ${MKTXT[keyOf(x)]||"-"}`).join("\n");
  try{await navigator.clipboard.writeText("إيمان — أنشطة التثبيت\n"+t);$("#copy").textContent="اتنسخت ✓";}catch(e){}};
$("#reset").onclick=()=>{if(confirm("تمسح كل التقييمات؟")){st={marks:{}};save();renderAll();}};
function loadJS(src){return new Promise((ok,no)=>{const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e);});}
$("#pdf").onclick=async()=>{const btn=$("#pdf"),t0=btn.textContent;btn.disabled=true;btn.textContent="جارِ التجهيز...";
  try{if(!window.html2canvas) await loadJS("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    if(!window.jspdf) await loadJS("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const L=shown(), box=document.createElement("div");
    box.style.cssText="position:fixed;left:-10000px;top:0;width:760px;padding:28px;background:#fff;color:#1E3A34;direction:rtl;font-family:Alexandria,Tahoma,sans-serif";
    const col={h:"#2F8A5B",t:"#2F8A5B",x:"#C2546B",n:"#5C716B"};
    const svg=k=>(ICO[k]||"").replace(/var\(--green\)/g,"#2F8A5B").replace(/var\(--paper\)/g,"#fff").replace(/var\(--rose\)/g,"#C2546B").replace(/var\(--rosebg\)/g,"#FBE7EB");
    box.innerHTML=`<div style="font-size:24px;font-weight:800">نتيجة أنشطة التثبيت</div><div style="color:#5C716B;margin:4px 0 16px">الطالبة: إيمان، الوحدة الثانية: الأسرة، ${filt.size?"البطاقات: "+fLabel():"كل البطاقات"} (${L.length})</div>
      <table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="background:#1E3A34;color:#fff"><th style="padding:7px;text-align:right">النشاط</th><th style="padding:7px;text-align:right">البطاقة</th><th style="padding:7px;text-align:right">البنود</th><th style="padding:7px;text-align:right">التقييم</th></tr>
      ${L.map(x=>{const k=keyOf(x);return `<tr style="border-bottom:1px solid #C9D6CF"><td style="padding:7px">${SECS[x.sec].name}</td><td style="padding:7px;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:16px">${esc(label(x))}${x.kind==="dots"?" ("+x.n+")":""}</td><td style="padding:7px">${esc(x.item)}</td><td style="padding:7px;color:${col[k]}"><span style="display:inline-block;width:20px;height:20px;vertical-align:middle">${svg(k)}</span> ${FL[k]}</td></tr>`;}).join("")}</table>`;
    document.body.appendChild(box); const cv=await html2canvas(box,{scale:2,backgroundColor:"#ffffff"}); box.remove();
    const {jsPDF}=window.jspdf, pdf=new jsPDF({unit:"pt",format:"a4"}); const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight(),m=24,pw=W-2*m,ph=H-2*m,sh=Math.floor(cv.width*ph/pw);
    for(let y=0,pg=0;y<cv.height;y+=sh,pg++){const c=document.createElement("canvas");c.width=cv.width;c.height=Math.min(sh,cv.height-y);c.getContext("2d").drawImage(cv,0,y,cv.width,c.height,0,0,cv.width,c.height);if(pg)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",m,m,pw,c.height*pw/cv.width);}
    const buf=pdf.output("arraybuffer"), name="تثبيت-إيمان"+(filt.size?"-"+[...filt].map(k=>FL[k]).join("-"):"")+".pdf";
    let dl=null; try{if(window.claude&&window.claude.use) dl=await window.claude.use("downloads");}catch(e){}
    if(dl){try{await dl.save({filename:name,data:buf});}catch(e){}}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/pdf"}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
  }catch(e){btn.textContent="ما اتحملش، جرّب تاني";setTimeout(()=>btn.textContent=t0,2500);btn.disabled=false;return;}
  btn.textContent=t0;btn.disabled=false;};
function renderAll(){renderGrids();renderResult();}
const TABS=["hw","aq","nm","dt","result"];
function route(){const h=location.hash.slice(1),t=TABS.includes(h)?h:"hw";
  $$("section").forEach(s=>s.classList.toggle("on",s.id==="s-"+t));
  $$("nav a").forEach(a=>{if(a.dataset.t===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});}
$$("nav a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();history.replaceState(null,"","#"+a.dataset.t);route();window.scrollTo(0,0);}));
renderAll();route();
})();
</script></body></html>
